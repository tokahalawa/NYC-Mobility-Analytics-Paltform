services:
  postgres:
    image: postgres:16
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: nyc_dwh
    ports:
      - "5432:5432"
    command: postgres -c synchronous_commit=off -c max_wal_size=8GB -c shared_buffers=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nyc_dwh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes: 
  pgdata: