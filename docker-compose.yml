services:
  postgres:
    image: postgres:16
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: nyc_dwh
    ports:
      - "5432:5432"
    command: postgres -c synchronous_commit=off -c max_wal_size=8GB -c shared_buffers=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d

  superset:
    image: apache/superset:latest
    container_name: nyc_superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=mysecretkey123
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin &&
      superset init &&
      /usr/bin/run-server.sh
      "

volumes:
  pgdata: