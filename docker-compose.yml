version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: nyc_dwh
    ports:
      - "5432:5432"
    command: postgres -c synchronous_commit=off -c max_wal_size=8GB -c shared_buffers=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - nyc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nyc_dwh"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:latest
    container_name: nyc_superset
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: mysecretkey123
      SUPERSET_LOAD_EXAMPLES: "no"
    command: >
      /bin/bash -c "
      /app/.venv/bin/pip install --no-cache-dir psycopg2-binary &&
      /app/.venv/bin/superset db upgrade &&
      /app/.venv/bin/superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin || true &&
      /app/.venv/bin/superset init &&
      /usr/bin/run-server.sh
      "
    networks:
      - nyc-net
    restart: unless-stopped

networks:
  nyc-net:
    driver: bridge

volumes:
  pgdata: