services:
  postgres:
    image: postgres:16
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: nyc_dwh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 
      - ./sql/init:/docker-entrypoint-initdb.d 

  airflow:
    image: apache/airflow:2.10.5
    container_name: nyc_airflow
    command: standalone
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://admin:admin123@postgres:5432/nyc_dwh"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./sql:/opt/airflow/sql

volumes:
  pgdata: