services:
  postgres:
    image: postgres:16
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: nyc_dwh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data ----- safeplace for data to not be erased-----
      - ./sql/init:/docker-entrypoint-initdb.d ------ folder mapping ----

  airflow:
    image: apache/airflow:2.10.5
    container_name: nyc_airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags

volumes:
  pgdata: