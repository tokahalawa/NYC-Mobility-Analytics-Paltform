
services:
  postgres:
    image: postgres:16
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: nyc_dwh
    ports:
      - "5432:5432"
    command: postgres -c synchronous_commit=off -c max_wal_size=8GB -c shared_buffers=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - nyc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nyc_dwh"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    image: nyc-superset:local
    container_name: nyc_superset
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "mysecretkey123"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://admin:admin123@nyc_postgres:5432/superset_meta"
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      /bin/bash -c "
      superset db upgrade &&
      (superset fab create-admin
      --username admin
      --firstname Admin
      --lastname User
      --email admin@superset.com
      --password admin || true) &&
      superset init &&
      /usr/bin/run-server.sh
      "
    networks:
      - nyc-net
    restart: unless-stopped

networks:
  nyc-net:
    driver: bridge

volumes:
  pgdata:
  superset_home:
